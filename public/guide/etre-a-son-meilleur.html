<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Être à son meilleur — Mon parcours de réflexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--mauve:#6E5285;--deep:#3E2C4E;--lav:#D9CDE4;--lavl:#EFE8F5;--beige:#EBE0D2;--cream:#F7F2EA;--paper:#FCFAF6;--yellow:#E8C765;--ink:#2B2233;--mute:#6F6478;--line:#E1D6C6;
--serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.65 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 22px 72px}
.wide{max-width:1040px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.2}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(247,242,234,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.top .in{max-width:1040px;margin:0 auto;padding:10px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{background:none;border:0;padding:10px 0;color:var(--mauve);font-size:15px;min-height:44px}
.link:hover{text-decoration:underline}
.saved{font-size:13px;color:var(--mute);transition:opacity .4s;opacity:0}
.saved.on{opacity:1}
/* accueil */
.hero{text-align:center;padding:56px 0 8px}
.hero h1{font-size:clamp(30px,8vw,48px);letter-spacing:.06em}
.hero .sub{font-family:var(--serif);font-style:italic;color:var(--mauve);font-size:clamp(19px,4.5vw,24px);margin-top:10px}
.rule{width:44px;height:2px;background:var(--yellow);margin:26px auto;border:0}
.intro{max-width:560px;margin:0 auto;text-align:center;color:#4a3f55}
.privacy{max-width:560px;margin:34px auto 0;background:var(--lavl);border-radius:18px;padding:28px 26px;text-align:center}
.privacy h2{font-size:24px;color:var(--deep)}
.privacy p{margin:12px 0 0;color:#4a3f55}
.privacy small{display:block;margin-top:16px;color:var(--mute);font-size:13.5px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:44px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.grid{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 14px 14px;min-height:150px;display:flex;flex-direction:column;transition:border-color .2s,transform .2s,box-shadow .2s}
.tile:hover,.tile:focus-visible{border-color:var(--mauve);transform:translateY(-2px);box-shadow:0 6px 18px rgba(62,44,78,.08);outline:none}
.tile .n{font-family:var(--serif);font-size:30px;color:var(--mauve);line-height:1}
.tile .t{font-size:14px;line-height:1.35;margin:10px 0 auto;color:var(--ink)}
.tile .st{font-size:12.5px;color:var(--mute);margin-top:12px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);display:inline-block}
.tile.done{background:var(--lavl);border-color:var(--lav)}
.chk{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--mauve);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.fin{display:block;width:100%;margin-top:18px;text-align:center;background:var(--deep);color:var(--cream);border:0;border-radius:14px;padding:22px 18px;transition:background .2s}
.fin:hover,.fin:focus-visible{background:#4d3a5f;outline:none}
.fin b{font-family:var(--serif);font-weight:400;font-size:21px;display:block;letter-spacing:.04em}
.fin span{font-size:14px;color:var(--lav)}
.foot{margin-top:46px;text-align:center;font-size:13.5px;color:var(--mute)}
.warn{background:#FBF1D2;border-radius:10px;padding:10px 14px;font-size:14px;margin-top:22px}
.confirm{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
/* boutons */
.btn{background:var(--mauve);color:#fff;border:0;border-radius:999px;padding:14px 26px;min-height:48px;font-size:16px;transition:background .2s}
.btn:hover,.btn:focus-visible{background:var(--deep);outline:none}
.btn.ghost{background:transparent;color:var(--mauve);border:1px solid var(--mauve)}
.btn.ghost:hover,.btn.ghost:focus-visible{background:var(--lavl);color:var(--deep)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* atelier */
.head{padding:44px 0 6px}
.eyebrow{font-size:14px;color:var(--mute)}
.head h1{font-size:clamp(28px,7vw,42px);margin-top:12px;color:var(--deep)}
.sec{margin-top:52px;padding-top:34px;border-top:1px solid var(--line)}
.sec h2{font-size:24px;color:var(--mauve);margin-bottom:16px}
.sec p{margin:0 0 14px}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
.qmeta{font-size:13.5px;color:var(--mute)}
.q{font-family:var(--serif);font-size:clamp(20px,5vw,24px);line-height:1.35;margin:10px 0 18px;color:var(--deep)}
.ink{width:100%;display:block;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;font:18px/1.75 var(--serif);color:var(--ink);padding:6px 2px 12px;resize:none;min-height:150px;transition:border-color .2s;outline:none;background-image:repeating-linear-gradient(transparent,transparent 30px,rgba(110,82,133,.10) 31px)}
.ink:focus{border-bottom-color:var(--mauve);box-shadow:0 2px 0 0 var(--yellow)}
.ink::placeholder{color:#b3a8bd}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.keep{background:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;color:var(--mute);min-height:44px}
.keep[aria-pressed=true]{border-color:var(--yellow);background:#FBF3D9;color:var(--ink)}
.dots{display:flex;gap:4px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dots button{width:28px;height:28px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--lav);display:block;transition:all .2s}
.dots .f i{background:var(--lav)}
.dots .c i{border-color:var(--mauve);background:var(--mauve);transform:scale(1.25)}
.aware{background:var(--lavl);border-radius:18px;padding:30px 22px;margin-top:52px;border-top:3px solid var(--yellow)}
.aware h2{font-size:24px;color:var(--deep);margin-bottom:8px}
.aware .ink{background-image:repeating-linear-gradient(transparent,transparent 30px,rgba(110,82,133,.16) 31px);min-height:190px}
.act{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:22px}
.lab{font-family:var(--serif);font-size:19px;color:var(--deep);margin:20px 0 6px}
.small{font-size:13.5px;color:var(--mute);line-height:1.5}
.callq{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--deep);margin:0 0 6px}
.done-card{background:var(--lavl);border-radius:16px;padding:22px;text-align:center;margin-top:22px}
.done-card .tick{width:38px;height:38px;border-radius:50%;background:var(--mauve);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
.bar{display:flex;flex-direction:column;gap:10px;margin-top:34px}
@media(min-width:560px){.bar{flex-direction:row;justify-content:space-between}}
/* final */
body.calm{background:var(--deep);color:var(--cream)}
body.calm .top{background:rgba(62,44,78,.94);border-color:#57436a}
body.calm .link{color:var(--lav)}
body.calm .saved{color:var(--lav)}
.fhead{text-align:center;padding:64px 0 10px}
.fhead h1{font-size:clamp(28px,7vw,44px);letter-spacing:.08em}
.fhead p{color:var(--lav);max-width:520px;margin:20px auto 0}
.ph{margin-top:54px}
.ph .lab{color:var(--cream);font-size:clamp(20px,5vw,25px);font-style:italic}
.ph .ink{color:var(--cream);border-bottom-color:#6f5a84;background-image:none;min-height:110px}
.ph .ink:focus{border-bottom-color:var(--yellow);box-shadow:none}
.ph .ink::placeholder{color:#8f7ca4}
.calm .btn{background:var(--yellow);color:var(--deep)}
.calm .btn:hover{background:#f1d47c}
.calm .btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--lav)}
/* bilan */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:44px 28px;margin-top:28px}
@media(min-width:620px){.sheet{padding:64px 60px}}
.sheet .kick{font-size:14px;color:var(--mute);letter-spacing:.08em}
.sheet h1{font-size:clamp(26px,6vw,36px);margin:10px 0 0;color:var(--deep)}
.sheet .bar2{width:36px;height:2px;background:var(--yellow);margin:26px 0 8px}
.sheet h3{font-size:13.5px;font-family:var(--sans);font-weight:500;letter-spacing:.1em;color:var(--mauve);margin:34px 0 10px}
.sheet .txt{font-family:var(--serif);font-size:19px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word}
.sheet .big{font-size:22px}
.sheet .qq{font-size:14px;color:var(--mute);font-style:italic;margin:16px 0 4px;font-family:var(--sans)}
.sheet .empty{color:var(--mute);font-style:italic;font-size:15px;font-family:var(--sans)}
.sheet .item{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.sheet .item h4{margin:0 0 4px;font:500 14px/1.4 var(--sans);color:var(--mute)}
.sheet.fs{background:var(--deep);color:var(--cream);border-color:var(--deep)}
.sheet.fs h1{color:var(--cream);letter-spacing:.08em}
.sheet.fs .kick{color:var(--lav)}
.sheet.fs h3{color:var(--yellow)}
.sheet.fs .item{border-color:#57436a}
.sheet.fs .item h4{color:var(--lav)}
@media print{
 @page{margin:16mm}
 body,body.calm{background:#fff!important;color:#2B2233!important;font-size:12pt}
 .noprint,.top{display:none!important}
 .wrap{padding:0;max-width:none}
 .sheet{border:0;padding:0;margin:0;background:#fff!important;color:#2B2233!important}
 .sheet.fs h1,.sheet.fs .txt{color:#2B2233!important}
 .sheet.fs h3{color:#6E5285!important}
 .sheet.fs .item{border-color:#E1D6C6}.sheet.fs .item h4{color:#6F6478}
 .sheet .item,.sheet .keepbl{break-inside:avoid}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>
<script>
const A=[
{t:`Notre attitude comme point de départ`,s:[
`Le chapitre pose les bases des habiletés humaines et relationnelles. L’auteur insiste sur le fait que les qualités que nous valorisons le plus chez les autres — honnêteté, authenticité, écoute, empathie, persévérance, attitude positive, etc. — ne sont pas simplement des traits fixes : elles peuvent se développer.`,
`L’attitude devient donc un point de départ. Nous pouvons apprendre à modifier notre manière d’interpréter une situation, à reconnaître nos émotions et à remplacer progressivement certains automatismes par des comportements plus conscients. L’auteur introduit aussi l’intelligence émotionnelle et l’agilité émotionnelle : identifier ce que l’on ressent, accepter l’émotion au lieu de la combattre, comprendre ce qu’elle nous indique et choisir ensuite une action cohérente.`,
`L’idée centrale est que devenir une meilleure version de soi ne repose pas seulement sur ce que l’on sait, mais sur la façon dont on se comporte, dont on réagit et dont on entre en relation avec les autres.`],
q:[`Quelles sont les 5 qualités humaines que tu admires le plus chez les autres?`,`Parmi ces qualités, lesquelles crois-tu incarner déjà naturellement?`,`Laquelle aimerais-tu développer davantage chez toi? Pourquoi?`,`Dans quelles situations ton attitude t’aide-t-elle à avancer?`,`Dans quelles situations ton attitude devient-elle plutôt un frein?`,`Quelle émotion as-tu tendance à éviter, minimiser ou repousser?`,`Quand cette émotion apparaît, quelle est ta réaction habituelle?`,`Si cette émotion était une information plutôt qu’un problème, qu’essaierait-elle peut-être de te dire?`],
a:`<b>Choisis une qualité humaine à pratiquer consciemment cette semaine.</b> Décris une situation précise dans laquelle tu veux l’incarner davantage.`,
c:`Quelle prise de conscience de ce chapitre aimerais-tu approfondir avec Éliane?`},
{t:`Notre curiosité comme vecteur de changement`,s:[
`Le changement est permanent. Plutôt que d’essayer de tout prévoir ou de conserver le statu quo, l’auteur propose de développer notre capacité d’adaptation. La curiosité devient alors un outil essentiel : elle nous permet de continuer à apprendre, d’explorer de nouvelles façons de faire et de remettre en question nos certitudes.`,
`Le chapitre oppose implicitement un état d’esprit figé à une mentalité de croissance. Une personne qui cultive cette dernière ne considère pas ses capacités comme définitives. Elle cherche à apprendre, à expérimenter et à évoluer. Dans un environnement incertain, « apprendre à apprendre » devient plus important que de croire que l’on possède déjà toutes les réponses.`,
`Le changement peut générer des préoccupations et de l’inconfort. La curiosité permet de remplacer une partie de la résistance par des questions : qu’est-ce que cette situation peut m’apprendre? Qu’est-ce que je peux essayer autrement? Que puis-je contrôler aujourd’hui?`],
q:[`Comment réagis-tu généralement lorsque quelque chose change sans que tu l’aies choisi?`,`Quel changement récent as-tu d’abord perçu négativement?`,`Avec du recul, qu’est-ce que ce changement t’a appris?`,`Dans quel domaine de ta vie fonctionnes-tu beaucoup sur le pilote automatique?`,`Quelle croyance sur toi-même considères-tu peut-être comme une vérité alors qu’elle pourrait évoluer?`,`Sur quel sujet aimerais-tu redevenir plus curieuse?`,`Qu’est-ce que tu pourrais apprendre ou essayer si tu acceptais de ne pas être bonne immédiatement?`,`Quelle question pourrais-tu te poser plus souvent au lieu de chercher immédiatement une réponse?`],
a:`<b>Fais volontairement une chose différemment cette semaine.</b> L’objectif n’est pas la performance : observe simplement ce que cette nouveauté t’apprend.`,
c:`Quel changement ou quelle incertitude aimerais-tu apprendre à aborder différemment?`},
{t:`L’autodiscipline : reflet de la relation avec soi`,s:[
`L’autodiscipline est présentée comme une relation avec soi-même : respecter les engagements que l’on prend envers soi renforce progressivement la confiance que l’on s’accorde. Elle ne se construit pas en un grand geste, mais par la répétition de petites actions.`,
`L’auteur compare l’autodiscipline à un muscle. Plus on la pratique, plus elle devient accessible. Il met aussi de l’avant les habitudes clés : certains comportements ont un effet d’entraînement sur plusieurs autres sphères de notre quotidien. L’objectif n’est donc pas nécessairement de tout changer simultanément, mais d’identifier quelques comportements structurants.`,
`Les grands objectifs deviennent plus réalisables lorsqu’ils sont découpés en petits pas suffisamment simples pour être répétés. La constance prend alors davantage d’importance que l’intensité ponctuelle.`],
q:[`Quand tu te fais une promesse à toi-même, à quel point as-tu tendance à la respecter?`,`Quelle promesse envers toi-même repousses-tu régulièrement?`,`Quelles excuses reviennent le plus souvent lorsque tu n’agis pas?`,`Y a-t-il une habitude dans ta vie qui a déjà eu un effet positif sur plusieurs autres comportements?`,`Quelle habitude clé aurait actuellement le plus d’impact sur ton quotidien?`,`Quel objectif te semble gros ou intimidant en ce moment?`,`Comment pourrais-tu le réduire à une action beaucoup plus petite?`,`Qu’est-ce qui serait réaliste de répéter même lors d’une semaine difficile?`],
a:`Choisis <b>un engagement simple et mesurable</b> à respecter pendant 7 jours. Il doit être suffisamment réaliste pour que tu puisses le tenir même si ta semaine n’est pas parfaite.`,
c:`Qu’est-ce qui t’aide réellement à être constante, et qu’est-ce qui fait habituellement dérailler ta constance?`},
{t:`L’automotivation : en quête d’un sens à donner à nos actions`,s:[
`La motivation durable ne repose pas uniquement sur les récompenses externes. Le chapitre invite à chercher le sens derrière nos actions : pourquoi est-ce important pour moi? À quoi est-ce que je contribue? Qu’est-ce que cet objectif représente réellement?`,
`L’autodiscipline et la motivation se renforcent mutuellement. Une raison forte nous aide à commencer; la discipline nous permet de continuer lorsque l’enthousiasme diminue. Les petits succès créés par une routine peuvent ensuite nourrir de nouveau la motivation.`,
`L’auteur invite donc à dépasser le simple « quoi » pour comprendre le « pourquoi ». Une tâche ordinaire peut prendre une tout autre valeur lorsqu’elle est reliée à une intention, à une identité ou à un objectif plus grand.`],
q:[`Qu’est-ce qui te motive le plus actuellement dans ta vie?`,`Pourquoi est-ce important pour toi, au-delà du résultat visible?`,`Quels objectifs poursuis-tu surtout parce que tu crois que tu <i>devrais</i> les poursuivre?`,`Si personne ne pouvait voir ou valider tes résultats, quels objectifs resteraient importants?`,`Quand ta motivation baisse, qu’est-ce qui disparaît généralement en premier?`,`Quel objectif actuel mériterait que tu clarifies davantage ton « pourquoi »?`,`Si tu atteignais cet objectif, qu’est-ce que cela changerait réellement dans ton quotidien?`,`Quelle action continuerais-tu à faire même sans résultat immédiat parce qu’elle est cohérente avec la personne que tu veux devenir?`],
a:`Écris ton objectif actuel sous cette forme : <b>« Je veux [ton objectif] parce que… ; c’est important pour moi parce que… »</b> Puis choisis une action hebdomadaire directement reliée à ce sens.`,
c:`Quel objectif semble aujourd’hui réellement venir de toi — et lequel mérite d’être remis en question?`},
{t:`La maîtrise de soi : contrôler ses émotions`,s:[
`La maîtrise de soi ne consiste pas à ne plus ressentir d’émotions. Elle consiste plutôt à créer suffisamment d’espace entre une émotion et notre réaction pour pouvoir choisir notre réponse.`,
`Sous l’effet du stress, de la peur ou de la colère, nos réactions peuvent devenir rapides et impulsives. L’autorégulation permet de reconnaître ce qui se passe avant que l’émotion prenne entièrement le contrôle. Le chapitre relie donc conscience émotionnelle, gestion des impulsions et capacité à demeurer cohérent dans des situations difficiles.`,
`La maîtrise de soi se développe avec la pratique. Plus nous apprenons à reconnaître nos déclencheurs, plus nous pouvons choisir une réponse utile plutôt qu’une réaction automatique.`],
q:[`Quelle émotion te fait réagir le plus rapidement?`,`Quels sont tes principaux déclencheurs?`,`Comment ton corps te signale-t-il que cette émotion commence à prendre de la place?`,`Quelle réaction regrettes-tu parfois après coup?`,`Dans quelles situations réussis-tu déjà très bien à garder ton calme?`,`Qu’est-ce que tu fais différemment dans ces situations?`,`Qu’est-ce qui pourrait t’aider à créer une pause avant de réagir?`,`Quelle réponse serait davantage alignée avec tes valeurs la prochaine fois que ce déclencheur apparaît?`],
a:`Crée ton <b>protocole de pause</b> : lorsqu’un déclencheur apparaît, quelle action de 10 à 60 secondes vas-tu utiliser avant de répondre?`,
c:`Identifie une situation de la semaine où tu aurais aimé répondre différemment.`},
{t:`La communication efficace : savoir écouter`,s:[
`La communication efficace repose moins sur le fait de parler davantage que sur la capacité à écouter réellement. L’auteur met particulièrement l’accent sur l’écoute active : offrir son attention, laisser l’autre terminer, poser des questions pertinentes et chercher à comprendre avant de répondre.`,
`Plusieurs comportements nuisent à l’écoute : interrompre, préparer mentalement notre réponse pendant que l’autre parle, ramener immédiatement son expérience à la nôtre, donner des conseils qui n’ont pas été demandés ou croire que nous savons déjà ce que l’autre veut dire.`,
`La maîtrise de soi joue ici un rôle important. Écouter un point de vue différent exige parfois de gérer notre propre inconfort afin de demeurer ouvert à ce que l’autre tente réellement de communiquer.`],
q:[`Quand quelqu’un te parle, écoutes-tu surtout pour comprendre ou pour répondre?`,`Lequel de ces pièges te ressemble le plus : interrompre, conseiller, comparer avec ton expérience, anticiper la réponse ou te distraire?`,`Avec qui as-tu le plus de difficulté à écouter sans te mettre sur la défensive?`,`Pourquoi cette personne ou ce sujet te déclenche-t-il davantage?`,`Quand tu te sens vraiment écoutée, qu’est-ce que l’autre personne fait?`,`Fais-tu toi-même ces choses pour les autres?`,`Quelle conversation importante mériterait davantage de questions et moins de conseils?`,`Qu’aimerais-tu mieux comprendre chez quelqu’un de ton entourage?`],
a:`Pendant une conversation importante cette semaine, pratique trois comportements : <b>ne pas interrompre, poser au moins deux questions de clarification et résumer ce que tu crois avoir compris avant de répondre.</b>`,
c:`Quelle différence as-tu remarquée lorsque tu as cherché à comprendre plutôt qu’à répondre?`},
{t:`L’empathie : pour comprendre l’autre et entrer en relation avec lui`,s:[
`Le chapitre distingue différentes dimensions de l’empathie : reconnaître l’émotion de l’autre, comprendre son point de vue et développer une empathie suffisamment mature pour tenir compte à la fois de ce que l’autre vit et de nos propres limites.`,
`Comprendre quelqu’un ne signifie pas présumer que l’on sait exactement ce qu’il ressent. Deux personnes peuvent vivre des situations similaires de manière très différente. L’auteur invite donc à remplacer les suppositions par l’écoute, l’ouverture et la curiosité.`,
`La compassion ajoute une dimension d’action : après avoir cherché à comprendre l’autre, que puis-je faire pour l’aider? L’empathie devient ainsi une façon de créer des relations plus humaines tout en conservant une juste distance émotionnelle.`],
q:[`As-tu tendance à dire rapidement « je comprends » lorsque quelqu’un vit quelque chose de difficile?`,`Comment pourrais-tu plutôt vérifier ce que cette personne vit réellement?`,`Avec quels types de personnes te vient-il naturellement d’être empathique?`,`Avec quels types de personnes est-ce plus difficile?`,`Qu’est-ce que cette différence révèle sur tes propres biais ou expériences?`,`Dans quelles situations absorbes-tu parfois trop les émotions des autres?`,`Comment pourrais-tu être présente pour quelqu’un sans porter son émotion à sa place?`,`Y a-t-il une personne dans ta vie que tu gagnerais à essayer de comprendre avant de vouloir la convaincre?`],
a:`Choisis une interaction cette semaine où ton objectif sera uniquement de <b>comprendre le point de vue de l’autre</b>, sans chercher immédiatement à corriger, convaincre ou résoudre.`,
c:`Qu’as-tu découvert en étant plus curieuse du vécu de l’autre?`},
{t:`L’élément déclencheur : la connaissance de soi`,s:[
`Ce chapitre constitue un pivot important du livre. L’auteur distingue la conscience de soi — remarquer ce que nous ressentons et ce qui se passe en nous — de la connaissance de soi, qui se construit aussi à travers nos expériences, notre réflexion, l’introspection et la rétroaction des autres.`,
`Mieux se connaître signifie reconnaître ses émotions, ses forces, ses faiblesses, ses capacités, ses limites et ses valeurs. Cette lucidité permet d’agir plutôt que de simplement réagir. L’auteur insiste également sur l’importance de définir ses valeurs et de vérifier si nos comportements sont réellement cohérents avec celles-ci.`,
`La connaissance de soi demande aussi d’accepter nos faiblesses et notre vulnérabilité. L’objectif n’est pas de construire une image parfaite de soi, mais une image plus juste, suffisamment bienveillante pour permettre l’amélioration.`],
q:[`Si tu devais te décrire honnêtement en cinq mots, lesquels choisirais-tu?`,`Quelles sont tes trois plus grandes forces?`,`Quelle faiblesse ou limite as-tu tendance à justifier plutôt qu’à regarder directement?`,`Quelles sont les cinq valeurs les plus importantes pour toi?`,`Parmi celles-ci, laquelle influence le plus tes décisions?`,`Y a-t-il une sphère de ta vie où tes actions sont actuellement en contradiction avec une de tes valeurs?`,`Si trois personnes proches de toi devaient te décrire, leurs réponses seraient-elles similaires à la tienne?`,`À la question « Comment est-ce de me côtoyer au quotidien? », que répondrais-tu?`,`Quelle rétroaction constructive serait utile pour mieux te connaître?`,`Qu’est-ce que tu aurais peut-être besoin d’accepter chez toi plutôt que de continuellement vouloir cacher ou corriger?`],
a:`Définis tes <b>5 valeurs principales</b>, avec ta propre définition de chacune. Choisis ensuite une décision ou une action cette semaine qui sera volontairement alignée avec l’une d’elles.`,
c:`Quelle découverte sur toi-même t’a le plus surprise ou dérangée? C’est probablement celle qui mérite le plus d’être explorée.`},
{t:`Le levier de la croissance : sortir de sa zone de confort`,s:[
`La croissance exige une certaine dose d’inconfort. Rester constamment dans ce que l’on maîtrise limite les occasions d’apprendre, de découvrir de nouvelles capacités et de mieux se connaître.`,
`L’auteur ne présente pas l’inconfort comme une recherche de difficulté pour elle-même. L’idée est plutôt de choisir volontairement de petites situations qui élargissent progressivement notre zone de confort. Essayer quelque chose de nouveau, accepter une opportunité imparfaite, tolérer de ne pas maîtriser immédiatement une situation ou prendre un risque raisonnable deviennent des occasions de croissance.`,
`L’échec change également de fonction : il devient une source d’information sur soi plutôt qu’une preuve que l’on n’est pas capable.`],
q:[`Dans quelle sphère de ta vie es-tu actuellement très confortable?`,`Est-ce un confort qui te fait du bien ou un confort qui te garde petite?`,`Quelle opportunité as-tu déjà refusée principalement par peur ou par inconfort?`,`De quoi avais-tu réellement peur?`,`Quelle chose aimerais-tu faire si tu savais que personne ne te jugerait?`,`Quel échec passé t’a finalement appris quelque chose d’important?`,`Quel inconfort serais-tu prête à accepter aujourd’hui pour grandir?`,`Quelle serait une version « 10 % plus courageuse » de ton comportement cette semaine?`],
a:`Choisis <b>un petit inconfort volontaire</b> : faire une demande, essayer une nouvelle activité, avoir une conversation, prendre une initiative ou faire quelque chose que tu repousses parce que tu n’es pas certaine du résultat.`,
c:`Qu’as-tu appris sur toi en faisant quelque chose avant de te sentir complètement prête?`},
{t:`La clé de la pérennité : l’observation et l’écoute permanente`,s:[
`Après avoir développé les outils personnels des chapitres précédents, l’enjeu devient de les utiliser au bon moment. L’observation et l’écoute permettent de mieux comprendre les personnes qui nous entourent et d’adapter notre comportement au contexte plutôt que d’utiliser la même approche avec tout le monde.`,
`L’auteur aborde aussi les éléments déclencheurs : des signaux ou rituels qui nous rappellent le comportement que nous voulons adopter. Pour qu’un comportement se produise, il faut notamment que la capacité, la motivation et un déclencheur soient présents.`,
`L’objectif est de transformer progressivement certaines intentions en automatismes utiles. Il ne suffit donc pas de savoir que l’on veut être plus calme, disciplinée ou attentive; il faut créer des rappels concrets qui nous aident à agir ainsi lorsque la situation se présente.`],
q:[`Quel comportement positif connais-tu très bien en théorie, mais oublies-tu souvent d’appliquer dans le moment?`,`Quel événement pourrait devenir ton rappel automatique?`,`Quels signaux chez les autres remarques-tu facilement?`,`Lesquels as-tu tendance à manquer?`,`Adaptes-tu ta façon de communiquer selon la personne devant toi?`,`Dans quelle relation gagnerais-tu à observer davantage avant d’agir?`,`Quel rituel quotidien pourrait te rappeler la personne que tu veux être?`,`Quel comportement aimerais-tu rendre presque automatique au cours des prochains mois?`],
a:`Crée une formule <b>« Quand X arrive, je fais Y »</b>. Exemple : « Quand je sens que je veux répondre impulsivement, je prends une respiration avant de parler. »`,
c:`Ton déclencheur a-t-il réellement fonctionné? Qu’est-ce qui devrait être ajusté?`},
{t:`Entretenir son réseau social`,s:[
`Le dernier chapitre déplace l’attention de soi vers les autres. Les relations se construisent et s’entretiennent par les gestes que nous posons : donner, aider, offrir de son temps, partager ses compétences, reconnaître les autres et contribuer sans toujours attendre un retour immédiat.`,
`L’auteur présente la générosité comme une habitude relationnelle. Les liens authentiques ne se construisent pas seulement lorsque nous avons besoin de quelque chose. Ils se nourrissent dans la durée par l’attention et la contribution.`,
`Le réseau social prend alors un sens beaucoup plus large que le réseautage professionnel : il représente l’ensemble des relations humaines que nous cultivons et la valeur que nous pouvons créer autour de nous.`],
q:[`Qui sont les personnes qui contribuent positivement à ta vie aujourd’hui?`,`À quelles relations accordes-tu beaucoup d’importance, mais pas suffisamment de temps?`,`As-tu tendance à contacter certaines personnes principalement lorsque tu as besoin de quelque chose?`,`À qui pourrais-tu donner quelque chose cette semaine sans rien attendre en retour?`,`Quelle compétence possèdes-tu qui pourrait aider quelqu’un?`,`Quel compliment sincère n’as-tu jamais pris le temps d’exprimer?`,`Quelle relation aimerais-tu entretenir davantage dans la prochaine année?`,`Quel type de personne veux-tu être dans le réseau des autres?`],
a:`Pose <b>un geste de générosité intentionnel</b> cette semaine : donner du temps, partager une compétence, offrir une aide, faire un compliment sincère ou reprendre contact avec quelqu’un.`,
c:`Quelle relation mériterait davantage d’investissement de ta part — et pourquoi?`}
];
const F=[`Aujourd’hui, être à mon meilleur signifie…`,`Pour être à mon meilleur, j’ai besoin de…`,`Je veux continuer à…`,`Je veux me rappeler que…`,`La personne que je veux continuer à devenir est…`];
const K='emd_journal_v1';
let mem={a:{},f:[]},store=true;
function load(){try{const r=localStorage.getItem(K);return r?JSON.parse(r):{a:{},f:[]}}catch(e){store=false;return{a:{},f:[]}}}
let S=load();
let tmr;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){store=false;const w=document.getElementById('warn');if(w)w.hidden=false}
 const s=document.getElementById('saved');if(s){s.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>s.classList.remove('on'),1400)}}
const at=n=>{const d=S.a[n]||(S.a[n]={q:[],r:'',act:'',call:'',skip:[],done:false});if(!d.skip)d.skip=[];return d};
const has=n=>{const x=S.a[n];return !!x&&(x.q.some(v=>v&&v.trim())||[x.r,x.act,x.call].some(v=>v&&v.trim()))};
const status=n=>S.a[n]&&S.a[n].done?'Terminé':has(n)?'En cours':'À commencer';
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const two=t=>esc(t).replace(' : ',' :<br>');
const strip=h=>h.replace(/<[^>]+>/g,'');
const pad=n=>String(n).padStart(2,'0');
let view={v:'home'},cur={};
const app=document.getElementById('app');
function go(v){view=v;render();window.scrollTo(0,0)}
function topbar(back,label,extra){return `<div class="top noprint"><div class="in"><button class="link" data-go="${back}">${label}</button><span class="saved" id="saved">Enregistré sur cet appareil</span>${extra||''}</div></div>`}

function home(){
 document.body.className='';
 let tiles=A.map((x,i)=>{const n=i+1,st=status(n),d=st==='Terminé';
  return `<button class="tile ${d?'done':''}" data-open="${n}" aria-label="Atelier ${n}, ${esc(x.t)}, ${st}"><span class="n">${pad(n)}</span><span class="t">${esc(x.t)}</span><span class="st">${st==='En cours'?'<i class="dot"></i>':''}${st}</span>${d?'<span class="chk" aria-hidden="true">✓</span>':''}</button>`}).join('');
 const fd=S.f.some(v=>v&&v.trim());
 return `<div class="wrap wide">
 <div class="hero"><h1>ÊTRE À SON MEILLEUR</h1><div class="sub">Mon parcours de réflexion</div><hr class="rule">
 <p class="intro">Ce parcours accompagne ta lecture de <i>Être à son meilleur</i>. Il n’y a pas de bonne ou de mauvaise réponse. Prends simplement le temps d’observer ce que chaque chapitre fait ressortir chez toi, de faire des liens avec ton quotidien et de mettre certaines prises de conscience en action.</p></div>
 <div class="privacy"><h2>Cet espace est à toi.</h2><p>Éliane n’a pas accès à ce que tu écris ici. Tu peux répondre librement et choisir toi-même ce que tu souhaites partager durant ton appel.</p>
 <small>Tes réflexions sont conservées localement, sur cet appareil et dans ce navigateur seulement. Elles ne sont envoyées nulle part.</small></div>
 <div class="warn" id="warn" ${store?'hidden':''}>Ce navigateur ne permet pas de conserver tes réponses (navigation privée, par exemple). Elles seront perdues si tu fermes cette page.</div>
 <div class="grid">${tiles}</div>
 <button class="fin" data-final="1"><b>ÊTRE À MON MEILLEUR</b><span>Une courte étape pour fermer le parcours${fd?' · '+(S.f.filter(v=>v&&v.trim()).length===5?'terminée ✓':'en cours'):''}</span></button>
 <div class="foot"><p>Pour retrouver tes réponses, reviens avec le même appareil et le même navigateur. Si tu vides les données de ton navigateur, elles seront effacées.</p>
 <button class="link" data-clear="1">Effacer mes réponses</button>
 <div class="confirm" id="conf" hidden><p style="margin:0 0 12px">Toutes tes réponses seront supprimées de cet appareil. Cette action est définitive.</p><div class="row" style="justify-content:center"><button class="btn" data-clear2="1">Oui, tout effacer</button><button class="btn ghost" data-clear0="1">Annuler</button></div></div></div></div>`}

function qblock(n){
 const x=A[n-1],d=at(n),i=cur[n]||0,tot=x.q.length,last=i===tot-1;
 const dots=x.q.map((_,j)=>`<button data-qi="${j}" aria-label="Question ${j+1}"><i></i></button>`).map((b,j)=>b.replace('<button',`<button class="${j===i?'c':(d.q[j]&&d.q[j].trim()?'f':'')}"`)).join('');
 return `<div class="qcard"><div class="qmeta">Question ${i+1} sur ${tot}</div><h3 class="q">${x.q[i]}</h3>
 <textarea class="ink" data-k="q:${i}" placeholder="Écris ici, aussi longtemps que tu le souhaites…" aria-label="Ta réponse">${esc(d.q[i])}</textarea>
 <div class="qnav"><button class="btn ghost" data-qp="1" ${i===0?'disabled style="opacity:.35"':''}>Précédente</button>
 <button class="keep" data-keep="${i}" aria-pressed="${!d.skip.includes(i)}">${!d.skip.includes(i)?'Dans mon bilan':'Ajouter à mon bilan'}</button>
 <button class="btn" data-qn="1">${last?'Ma prise de conscience':'Suivante'}</button></div>
 <div class="dots">${dots}</div></div>`}

function finishBlock(n){const d=at(n);
 return d.done?`<div class="done-card"><div class="tick">✓</div><p style="margin:0 0 14px">Ton atelier est terminé. Tu peux revenir modifier tes réponses quand tu veux.</p><div class="row" style="justify-content:center"><button class="btn" data-bilan="${n}">Voir mon bilan</button><button class="link" data-reopen="1">Rouvrir l’atelier</button></div></div>`
 :`<div class="row" style="justify-content:center"><button class="btn" data-finish="1">J’ai terminé ma réflexion</button></div>`}

function atelier(n){
 document.body.className='';
 const x=A[n-1],d=at(n),prev=n>1?`<button class="btn ghost" data-open="${n-1}">Atelier ${pad(n-1)}</button>`:'<span></span>';
 const next=n<11?`<button class="btn ghost" data-open="${n+1}">Atelier ${pad(n+1)}</button>`:`<button class="btn ghost" data-final="1">Être à mon meilleur</button>`;
 return topbar('home','← Mon parcours')+`<div class="wrap">
 <div class="head"><div class="eyebrow">Semaine ${n} · Chapitre ${n}</div><h1>${pad(n)}<br>${two(x.t)}</h1></div>
 <section class="sec"><h2>Cette semaine</h2>${x.s.map(p=>`<p>${p}</p>`).join('')}</section>
 <section class="sec"><h2>Ma réflexion</h2><div id="qb">${qblock(n)}</div></section>
 <section class="aware" id="conscience"><h2>Ma prise de conscience</h2><p style="margin:0 0 12px">Après avoir pris le temps de réfléchir à ces questions, qu’est-ce que tu comprends mieux sur toi aujourd’hui?</p>
 <textarea class="ink" data-k="r" placeholder="Ce que je comprends mieux…" aria-label="Ma prise de conscience">${esc(d.r)}</textarea></section>
 <section class="sec"><h2>Mon action de la semaine</h2><div class="act">${x.a}</div>
 <div class="lab">Cette semaine, je m’engage à…</div><textarea class="ink" style="min-height:110px" data-k="act" placeholder="Une seule action, concrète et réaliste." aria-label="Mon engagement">${esc(d.act)}</textarea></section>
 <section class="sec"><h2>Pour mon appel avec Éliane</h2><p class="callq">${x.c}</p>
 <p style="margin:6px 0 4px">Y a-t-il quelque chose de cette réflexion que tu aimerais apporter à ton prochain appel avec Éliane?</p>
 <p class="small">Tu choisis ce que tu souhaites partager. Tes autres réponses restent dans ton espace personnel.</p>
 <textarea class="ink" data-k="call" placeholder="Ce que je choisis d’apporter…" aria-label="Pour mon appel">${esc(d.call)}</textarea></section>
 <section class="sec"><div id="fb">${finishBlock(n)}</div>
 <div class="row" style="justify-content:center;margin-top:14px"><button class="link" data-bilan="${n}">Voir mon bilan</button></div></section>
 <div class="bar noprint">${prev}${next}</div></div>`}

function bilan(n){
 document.body.className='';
 const x=A[n-1],d=at(n);
 const kept=x.q.map((_,i)=>i).filter(i=>d.q[i]&&d.q[i].trim()&&!d.skip.includes(i));
 const sec=(h,t,big)=>`<h3>${h}</h3>${t&&t.trim()?`<div class="txt ${big?'big':''}">${esc(t)}</div>`:`<div class="empty noprint">Rien d’écrit pour l’instant. Tu peux retourner à ton atelier quand tu le souhaites.</div>`}`;
 return topbar('at'+n,'← Retour à mon atelier')+`<div class="wrap"><div class="sheet" id="sheet">
 <div class="kick">ATELIER ${pad(n)}</div><h1>${two(x.t)}</h1><div class="bar2"></div>
 ${sec('MA PRINCIPALE PRISE DE CONSCIENCE',d.r,true)}
 <h3>CE QUE JE VEUX RETENIR</h3>${kept.length?kept.map(i=>`<div class="keepbl"><div class="qq">${strip(x.q[i])}</div><div class="txt">${esc(d.q[i])}</div></div>`).join(''):`<div class="empty noprint">Tes réponses de la section « Ma réflexion » apparaîtront ici.</div>`}
 ${sec('MON ENGAGEMENT',d.act)}
 ${sec('POUR MON PROCHAIN APPEL',d.call)}
 </div>
 <div class="row noprint" style="justify-content:center;margin-top:26px"><button class="btn" data-print="1">Enregistrer mon bilan en PDF</button></div>
 <p class="small noprint" id="pmsg" style="text-align:center;margin-top:10px">Ton bilan sera enregistré en PDF sur ton appareil.</p></div>`}

function final(){
 document.body.className='calm';
 return topbar('home','← Mon parcours')+`<div class="wrap"><div class="fhead"><h1>ÊTRE À MON MEILLEUR</h1><p>Après ces 11 chapitres et toutes les réflexions que tu as prises le temps de faire, prends quelques minutes pour mettre des mots sur ce que tu veux garder avec toi.</p></div>
 ${F.map((f,i)=>`<div class="ph"><div class="lab">${f}</div><textarea class="ink" data-k="f:${i}" aria-label="${esc(f)}">${esc(S.f[i])}</textarea></div>`).join('')}
 <div class="row" style="justify-content:center;margin-top:54px"><button class="btn" data-fbilan="1">Voir ma dernière page</button></div></div>`}

function fbilan(){
 document.body.className='calm';
 const ph=F.map((f,i)=>S.f[i]&&S.f[i].trim()?`<div class="item"><h4>${f}</h4><div class="txt big">${esc(S.f[i])}</div></div>`:'').join('')||`<div class="empty noprint">Tes phrases à compléter apparaîtront ici.</div>`;
 const aw=A.map((x,i)=>{const d=S.a[i+1];return d&&d.r&&d.r.trim()?`<div class="item"><h4>${pad(i+1)} · ${esc(x.t)}</h4><div class="txt">${esc(d.r)}</div></div>`:''}).join('');
 const ac=A.map((x,i)=>{const d=S.a[i+1];return d&&d.act&&d.act.trim()?`<div class="item"><h4>${pad(i+1)} · ${esc(x.t)}</h4><div class="txt">${esc(d.act)}</div></div>`:''}).join('');
 return topbar('final','← Retour')+`<div class="wrap"><div class="sheet fs" id="sheet"><div class="kick">ÊTRE À MON MEILLEUR</div><h1>Mon parcours</h1><div class="bar2"></div>
 ${ph}${aw?`<h3>MES PRISES DE CONSCIENCE</h3>${aw}`:''}${ac?`<h3>MES ENGAGEMENTS</h3>${ac}`:''}</div>
 <div class="row noprint" style="justify-content:center;margin-top:26px"><button class="btn" data-print="1">Enregistrer en PDF</button></div>
 <p class="small noprint" id="pmsg" style="text-align:center;margin-top:10px;color:var(--lav)">Ton bilan sera enregistré en PDF sur ton appareil.</p></div>`}

function render(){
 const v=view.v;
 app.innerHTML=v==='home'?home():v==='at'?atelier(view.n):v==='bilan'?bilan(view.n):v==='final'?final():fbilan();
 document.querySelectorAll('textarea.ink').forEach(grow);
}
function grow(el){el.style.height='auto';el.style.height=Math.max(el.scrollHeight+4,parseInt(getComputedStyle(el).minHeight)||0)+'px'}

app.addEventListener('input',e=>{const el=e.target;if(!el.dataset.k)return;grow(el);
 const k=el.dataset.k;
 if(k.startsWith('f:')){S.f[+k.slice(2)]=el.value}
 else{const d=at(view.n);if(k.startsWith('q:'))d.q[+k.slice(2)]=el.value;else d[k]=el.value}
 clearTimeout(input.t);input.t=setTimeout(save,350)});
function input(){}
app.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.k){clearTimeout(input.t);save()}});
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const D=b.dataset;
 if(D.go)return go(D.go==='home'?{v:'home'}:D.go==='final'?{v:'final'}:{v:'at',n:+D.go.slice(2)});
 if(D.open)return go({v:'at',n:+D.open});
 if(D.final)return go({v:'final'});
 if(D.fbilan)return go({v:'fbilan'});
 if(D.bilan)return go({v:'bilan',n:+D.bilan});
 if(D.clear)return void(document.getElementById('conf').hidden=false);
 if(D.clear0)return void(document.getElementById('conf').hidden=true);
 if(D.clear2){S={a:{},f:[]};cur={};try{localStorage.removeItem(K)}catch(_){}return go({v:'home'})}
 const n=view.n;
 if(D.qi!==undefined){cur[n]=+D.qi;return void(document.getElementById('qb').innerHTML=qblock(n),grow(document.querySelector('#qb textarea')))}
 if(D.qp){cur[n]=Math.max(0,(cur[n]||0)-1);return void(document.getElementById('qb').innerHTML=qblock(n),grow(document.querySelector('#qb textarea')))}
 if(D.qn){const i=cur[n]||0;if(i>=A[n-1].q.length-1)return void document.getElementById('conscience').scrollIntoView({behavior:'smooth'});
  cur[n]=i+1;return void(document.getElementById('qb').innerHTML=qblock(n),grow(document.querySelector('#qb textarea')))}
 if(D.keep!==undefined){const d=at(n),i=+D.keep,p=d.skip.indexOf(i);p<0?d.skip.push(i):d.skip.splice(p,1);save();
  b.setAttribute('aria-pressed',p>=0);b.textContent=p>=0?'Dans mon bilan':'Ajouter à mon bilan';return}
 if(D.finish){at(n).done=true;save();document.getElementById('fb').innerHTML=finishBlock(n);return}
 if(D.reopen){at(n).done=false;save();document.getElementById('fb').innerHTML=finishBlock(n);return}
 if(D.print)return void exportPdf();
});
function buildPdf(J,m){
 const doc=new J({unit:'mm',format:'a4'}),W=210,H=297,M=24,TW=W-2*M;let y=M+6;
 const clean=s=>String(s||'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\x09\x0A\x20-\x7E -ÿ]/g,'');
 const need=h=>{if(y+h>H-M){doc.addPage();y=M}};
 const write=(t,size,font,style,col,lh)=>{doc.setFont(font,style);doc.setFontSize(size);doc.setTextColor(col[0],col[1],col[2]);
  doc.splitTextToSize(clean(t),TW).forEach(l=>{need(lh);doc.text(l,M,y);y+=lh})};
 write(m.kick,9,'helvetica','normal',[111,100,120],5);y+=3;
 m.title.split('\n').forEach(l=>write(l,24,'times','normal',[62,44,78],10.5));
 y+=4;doc.setFillColor(232,199,101);doc.rect(M,y,12,.8,'F');y+=6;
 m.sections.forEach(s=>{if(!s.items.length)return;y+=8;need(20);write(s.h,8.5,'helvetica','bold',[110,82,133],5);y+=3;
  s.items.forEach(it=>{if(it.q){write(it.q,9.5,'times','italic',[111,100,120],5);y+=1}
   write(it.t,s.big?13.5:11.5,'times','normal',[43,34,51],s.big?7.2:6.2);y+=5})});
 return doc}

function pdfModel(){
 if(view.v==='bilan'){const n=view.n,x=A[n-1],d=at(n);
  const kept=x.q.map((_,i)=>i).filter(i=>d.q[i]&&d.q[i].trim()&&!d.skip.includes(i)).map(i=>({q:strip(x.q[i]),t:d.q[i]}));
  const one=t=>t&&t.trim()?[{t}]:[];
  return{file:'atelier-'+pad(n)+'-bilan.pdf',kick:'ATELIER '+pad(n),title:x.t.replace(' : ',' :\n'),sections:[
   {h:'MA PRINCIPALE PRISE DE CONSCIENCE',big:1,items:one(d.r)},{h:'CE QUE JE VEUX RETENIR',items:kept},
   {h:'MON ENGAGEMENT',items:one(d.act)},{h:'POUR MON PROCHAIN APPEL',items:one(d.call)}]}}
 const ph=F.map((f,i)=>S.f[i]&&S.f[i].trim()?{q:f,t:S.f[i]}:null).filter(Boolean);
 const by=k=>A.map((x,i)=>{const d=S.a[i+1];return d&&d[k]&&d[k].trim()?{q:pad(i+1)+' · '+x.t,t:d[k]}:null}).filter(Boolean);
 return{file:'etre-a-mon-meilleur-mon-parcours.pdf',kick:'ÊTRE À MON MEILLEUR',title:'Mon parcours',sections:[
  {h:'MES PHRASES',big:1,items:ph},{h:'MES PRISES DE CONSCIENCE',items:by('r')},{h:'MES ENGAGEMENTS',items:by('act')}]}}
async function exportPdf(){
 const msg=t=>{const m=document.getElementById('pmsg');if(m)m.textContent=t};
 const viaPrint=()=>{try{window.print();msg('Dans la fenêtre qui s’ouvre, choisis « Enregistrer en PDF » comme destination.')}catch(_){msg('Impossible de créer le PDF dans ce navigateur. Ouvre cette page dans Safari ou Chrome, puis réessaie.')}};
 let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(_){}
 if(!dl||!window.jspdf){return viaPrint()}
 try{const m=pdfModel(),doc=buildPdf(window.jspdf.jsPDF,m);
  await dl.save({filename:m.file,data:doc.output('blob')});msg('Ton PDF est prêt.')}
 catch(e){if(e&&e.code==='declined')msg('Téléchargement annulé.');else viaPrint()}}
render();
</script>
